name: Build Last Leaf for iPhone and iPad

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Build for Simulator, registered devices, or TestFlight
        type: choice
        default: simulator
        options:
          - simulator
          - ad-hoc
          - testflight

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Locate the Flutter project
        id: project
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE"
          if [[ -f Lanleaf-source.zip ]]; then
            unzip -q Lanleaf-source.zip -d "$RUNNER_TEMP/source"
            project="$RUNNER_TEMP/source/lanleaf"
          fi
          if [[ ! -f "$project/ci/build-ios-release.sh" ]]; then
            echo 'Upload the current Lanleaf-source.zip or commit the extracted Flutter project.' >&2
            exit 1
          fi
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'

      - name: Fetch locked dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          xcodebuild -version
          flutter pub get --enforce-lockfile

      - name: Build for Simulator
        if: inputs.distribution == 'simulator'
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter build ios --simulator --debug --no-pub
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app \
            "$RUNNER_TEMP/Last-Leaf-iOS-Simulator.zip"

      - name: Build signed IPA
        if: inputs.distribution != 'simulator'
        working-directory: ${{ steps.project.outputs.path }}
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_AD_HOC_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROFILE_BASE64 }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: bash ci/build-ios-release.sh "$DISTRIBUTION" "$RUNNER_TEMP/Last-Leaf-iOS-iPadOS.ipa"

      - name: Upload Simulator build
        if: inputs.distribution == 'simulator'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Last-Leaf-iOS-Simulator.zip
          archive: false
          if-no-files-found: error

      - name: Upload signed IPA
        if: inputs.distribution != 'simulator'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Last-Leaf-iOS-iPadOS.ipa
          archive: false
          if-no-files-found: error
