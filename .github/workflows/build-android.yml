name: Build Last Leaf for Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Locate the Flutter project
        id: project
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE"
          if [[ -f Lanleaf-source.zip ]]; then
            unzip -q Lanleaf-source.zip -d "$RUNNER_TEMP/source"
            project="$RUNNER_TEMP/source/lanleaf"
          fi
          if [[ ! -f "$project/android/app/build.gradle.kts" ]]; then
            echo 'Upload the current Lanleaf-source.zip or commit the extracted Flutter project.' >&2
            exit 1
          fi
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'

      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Fetch locked dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter build apk --debug --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/Last-Leaf-Android-debug.apk"

      - name: Build signed release APK
        if: inputs.build_type == 'release'
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAST_LEAF_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$LAST_LEAF_SIGNING_PASSWORD" ]]; then
            echo 'Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Actions secrets.' >&2
            exit 1
          fi
          signing_dir="$(mktemp -d "$RUNNER_TEMP/last-leaf-android.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export LAST_LEAF_SIGNING_STORE="$signing_dir/last-leaf.p12"
          export LAST_LEAF_SIGNING_ALIAS="${ANDROID_KEY_ALIAS:-last-leaf}"
          export LAST_LEAF_SIGNING_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$LAST_LEAF_SIGNING_PASSWORD}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ['LAST_LEAF_SIGNING_STORE'])
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())
          path.write_bytes(base64.b64decode(encoded, validate=True))
          PY
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --no-pub
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Last-Leaf-Android-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Last-Leaf-Android-${{ inputs.build_type }}.apk
          archive: false
          if-no-files-found: error
