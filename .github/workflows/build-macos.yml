name: Build Lanleaf for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install Flutter 3.50.0
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build and package
        run: |
          unzip -q Lanleaf-source.zip -d "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source/lanleaf"
          flutter pub get
          flutter build macos --release
          app=build/macos/Build/Products/Release/lanleaf.app
          lipo -archs "$app/Contents/MacOS/lanleaf"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Lanleaf-macOS.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Lanleaf-macOS.zip
          if-no-files-found: error
          archive: false
